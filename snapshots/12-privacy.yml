            - generic [ref=e43]:
              - paragraph [ref=e44]: "Effective Date: September 8, 2026 · Last Updated: September 8, 2026"
              - heading "Privacy Policy" [level=1] [ref=e45]
              - generic [ref=e46]:
                - paragraph [ref=e47]: Puku AI ("Puku") is operated by Poridhi io Limited, a company incorporated in Bangladesh. This Privacy Policy explains how Puku collects, processes, uses, stores, and shares information when you use the Puku mobile application, your Puku account, Puku AI features, payment features, and related support services.
