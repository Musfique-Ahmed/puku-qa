            - generic [ref=e88]:
              - paragraph [ref=e89]: "02"
              - heading "2. Subscription Cancellation" [level=2] [ref=e90]
              - paragraph [ref=e91]:
                - text: You may cancel your subscription at any time through your Account settings or by contacting us at
                - link "support@puku.sh" [ref=e92] [cursor=pointer]:
                  - /url: mailto:support@puku.sh
                - text: .
              - paragraph [ref=e93]: To avoid being charged for the next billing period, you must cancel at least twenty-four (24) hours before your subscription is scheduled to renew. Once cancelled, you will keep access to paid features until the end of your then-current billing period, after which your Account will revert to the free plan (if available) or lose access to paid features.
            - generic [ref=e94]:
              - paragraph [ref=e95]: "03"
              - heading "3. General Refund Policy" [level=2] [ref=e96]
              - paragraph [ref=e97]:
                - text: Except as described in
                - link "Section 4" [ref=e98] [cursor=pointer]:
                  - /url: "#when-we-refund"
                - text: or as required by applicable law, all subscription fees are non-refundable, including for partial billing periods, unused features, downgrades made partway through a billing period, or Account inactivity. We do not prorate or refund fees simply because you decide to stop using the Service partway through a paid term.
            - generic [ref=e99]:
              - paragraph [ref=e100]: "04"
              - heading "4. When We Will Issue a Refund" [level=2] [ref=e101]
              - paragraph [ref=e102]: "We will issue a refund, in whole or in part, in the following circumstances:"
              - list [ref=e103]:
                - listitem [ref=e104]:
                  - strong [ref=e105]: "Duplicate or erroneous charge:"
                  - text: you were charged more than once for the same billing period, or charged an amount that does not match the plan you purchased.
                - listitem [ref=e106]:
                  - strong [ref=e107]: "Unauthorized charge:"
                  - text: your payment method was charged without your authorization, subject to our standard verification process.
                - listitem [ref=e108]:
                  - strong [ref=e109]: "Service failure:"
                  - text: the Service was materially unavailable or unusable for a significant portion of your billing period due to a fault on our side, and we were unable to resolve it within a reasonable time.
                - listitem [ref=e110]:
                  - strong [ref=e111]: "Termination for our convenience:"
                  - text: if we terminate your paid subscription for a reason other than your breach of the Terms of Service, we will refund the unused, pro-rata portion of the fees you already paid for that subscription term.
              - paragraph [ref=e112]: Refunds under this Section are issued at our reasonable discretion after we review your request, and may be full or partial depending on the circumstances.
            - generic [ref=e113]:
              - paragraph [ref=e114]: "05"
              - heading "5. Free Trials and Promotional Credits" [level=2] [ref=e115]
              - paragraph [ref=e116]: If we offer a free trial or promotional credit, no payment is due until the trial or credit period ends. If you do not cancel before a free trial converts to a paid subscription, you will be charged the applicable fee for the plan you selected, and that charge is subject to this Policy.
              - paragraph [ref=e117]: Promotional credits have no cash value and are not refundable or redeemable for cash.
            - generic [ref=e118]:
              - paragraph [ref=e119]: "06"
              - heading "6. Statutory Rights for Users Outside Bangladesh" [level=2] [ref=e120]
              - paragraph [ref=e121]:
                - text: Nothing in this Policy limits any non-waivable statutory right you may have to cancel a purchase or receive a refund under the mandatory consumer-protection law of your country of residence. For example, consumers in the European Union and United Kingdom may have a statutory right to withdraw from an online purchase of digital content within fourteen (14) days of purchase, subject to the conditions and exceptions in that law (including where you have expressly consented to immediate performance and acknowledged the resulting loss of the withdrawal right). Where such a right applies to you and you validly exercise it, we will honor it in place of the general policy set out in
                - link "Section 3" [ref=e122] [cursor=pointer]:
                  - /url: "#general"
                - text: .
            - generic [ref=e123]:
              - paragraph [ref=e124]: "07"
