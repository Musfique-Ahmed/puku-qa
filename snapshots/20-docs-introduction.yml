            - heading "Introduction" [level=1] [ref=e95]
            - paragraph [ref=e96]: Puku Editor is a VS Code-based editor with AI chat, inline completions, and semantic code search. Open a workspace to give these features project context, then inspect the code behind any answer or suggestion.
            - heading [level=2] [ref=e97]:
              - link "What is Puku?" [ref=e98] [cursor=pointer]:
                - /url: "#what-is-puku"
              - button "Copy Anchor Link" [ref=e99]
            - paragraph [ref=e104]: Puku builds on VS Code and adds code suggestions, workspace search, and agent chat. Use search to locate a relevant file, chat to understand it, and completions while editing.
            - heading [level=2] [ref=e105]:
              - link "Available Platforms" [ref=e106] [cursor=pointer]:
                - /url: "#available-platforms"
              - button "Copy Anchor Link" [ref=e107]
