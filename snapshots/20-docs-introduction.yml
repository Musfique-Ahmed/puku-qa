            - paragraph [ref=e208]:
              - strong [ref=e209]: Indexing
              - text: "- Puku parses workspace code into semantic chunks and caches embeddings for retrieval. Indexing time depends on project size and environment."
            - paragraph [ref=e210]:
              - strong [ref=e211]: Predictions
              - text: "- As you edit, Puku can use recent changes and codebase structure to suggest code. Review suggestions before accepting them."
            - paragraph [ref=e212]:
              - strong [ref=e213]: Data
              - text: "- Puku keeps a workspace index locally. AI features may send context to remote services for inference or embedding generation. Keep generated index data out of Git, review any shared project instructions, and check the context you attach to a prompt. See"
              - link "the workspace folder guide" [ref=e214] [cursor=pointer]:
                - /url: /docs/puku-editor/features/workspace-folder
              - text: .
            - heading [level=2] [ref=e215]:
              - link "Who Is Puku For?" [ref=e216] [cursor=pointer]:
                - /url: "#who-is-puku-for"
              - button "Copy Anchor Link" [ref=e217]
            - paragraph [ref=e222]:
              - text: Puku can help you explore an unfamiliar repository or work on a change in a codebase you already know. Open the relevant workspace, then use
              - link "Quickstart" [ref=e223] [cursor=pointer]:
                - /url: /docs/puku-editor/quick-start
              - text: for a first task. Teams should review generated changes through their usual code review and test process.
            - heading [level=2] [ref=e224]:
              - link "Next Steps" [ref=e225] [cursor=pointer]:
                - /url: "#next-steps"
              - button "Copy Anchor Link" [ref=e226]
            - paragraph [ref=e231]: To get started, install Puku, open a project, sign in, and try a code question. Check the cited file before acting on an answer.
