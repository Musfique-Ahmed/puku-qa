              - button "Copy Anchor Link" [ref=e134]
            - heading [level=3] [ref=e139]:
              - link "PUKU-AI Context Engine" [ref=e140] [cursor=pointer]:
                - /url: "#puku-ai-context-engine"
              - button "Copy Anchor Link" [ref=e141]
            - paragraph [ref=e146]: PUKU-AI routes requests across models based on task context. Its published design describes learning from acceptance rates, response timing, and follow-up edits. Model selection can affect relevance and speed; inspect the answer and any changed code before using it.
            - heading [level=3] [ref=e147]:
              - link "Fill-In-the-Middle (FIM) Completions" [ref=e148] [cursor=pointer]:
                - /url: "#fill-in-the-middle-fim-completions"
              - button "Copy Anchor Link" [ref=e149]
            - paragraph [ref=e154]: Fill-In-the-Middle completions consider code before and after the cursor. Start a function near an existing pattern and review the ghost text for correct types, APIs, and edge cases.
            - heading [level=3] [ref=e155]:
              - link "Semantic Code Understanding" [ref=e156] [cursor=pointer]:
                - /url: "#semantic-code-understanding"
              - button "Copy Anchor Link" [ref=e157]
            - paragraph [ref=e162]: Vector embeddings and AST-based chunking can surface related code without an exact text match. Search for "authentication logic," then open the results to check whether they implement the behavior you meant.
            - heading [level=3] [ref=e163]:
              - link "Edge-Deployed Backend" [ref=e164] [cursor=pointer]:
                - /url: "#edge-deployed-backend"
              - button "Copy Anchor Link" [ref=e165]
            - paragraph [ref=e170]: The published architecture uses Cloudflare Workers and a local workspace index. Network, model, and project size affect response time. AI inference and embedding generation may process project context remotely; a local index does not make all AI processing local.
            - heading [level=2] [ref=e171]:
              - link "Core Features" [ref=e172] [cursor=pointer]:
                - /url: "#core-features"
              - button "Copy Anchor Link" [ref=e173]
