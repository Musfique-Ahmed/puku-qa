              - generic [ref=e109]:
                - paragraph [ref=e110]: If you are having trouble with your Puku account, AI features, subscription, payment, or mobile app, our support team can help.
                - paragraph [ref=e111]:
                  - strong [ref=e112]: "Support Email:"
                  - link "support@puku.sh" [ref=e113] [cursor=pointer]:
                    - /url: mailto:support@puku.sh
                - paragraph [ref=e114]: The Puku support email is actively monitored. Our support team will review your request as soon as reasonably possible.
            - complementary "At a glance" [ref=e115]:
              - paragraph [ref=e116]: Summary
              - paragraph [ref=e117]:
                - text: Need help with Puku? Reach the right team for the question you have. Account, billing, and technical issues go to
                - strong [ref=e118]: support@puku.sh
                - text: . Privacy and legal requests go to
                - strong [ref=e119]: legal@puku.sh
                - text: . Anything else can be sent to
                - strong [ref=e120]: contact@puku.sh
                - text: .
              - generic [ref=e121]:
                - generic [ref=e122]:
                  - term [ref=e123]: Account, billing, technical
                  - definition [ref=e124]:
                    - link "support@puku.sh" [ref=e125] [cursor=pointer]:
