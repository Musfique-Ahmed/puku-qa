                      - /url: mailto:legal@puku.sh
                - generic [ref=e130]:
                  - term [ref=e131]: What we never ask for
                  - definition [ref=e132]: Passwords, OTP codes, payment credentials, or recovery codes — never share these with support.
            - generic [ref=e133]:
              - paragraph [ref=e134]: "01"
              - heading "Need Help With Puku?" [level=2] [ref=e135]
              - paragraph [ref=e136]: If you are having trouble with your Puku account, AI features, subscription, payment, or mobile app, our support team can help.
              - paragraph [ref=e137]:
                - strong [ref=e138]: "Support Email:"
                - link "support@puku.sh" [ref=e139] [cursor=pointer]:
                  - /url: mailto:support@puku.sh
              - paragraph [ref=e140]: The Puku support email is actively monitored. Our support team will review your request as soon as reasonably possible.
            - generic [ref=e141]:
              - paragraph [ref=e142]: "02"
              - heading "Account and Login" [level=2] [ref=e143]
              - paragraph [ref=e144]: "Contact support if you are having trouble accessing your account, including:"
              - list [ref=e145]:
                - listitem [ref=e146]: Can't sign in
                - listitem [ref=e147]: Google Sign-In issue
                - listitem [ref=e148]: Microsoft sign-in issue
                - listitem [ref=e149]: Magic-link issue
                - listitem [ref=e150]: Lost access to your account
              - paragraph [ref=e151]: "Puku currently supports:"
              - list [ref=e152]:
                - listitem [ref=e153]: Google Sign-In
                - listitem [ref=e154]: Microsoft sign-in
                - listitem [ref=e155]: Magic link
              - paragraph [ref=e156]: "Puku does not currently support:"
              - list [ref=e157]:
                - listitem [ref=e158]: Sign in with Apple
                - listitem [ref=e159]: Email/password login
                - listitem [ref=e160]: Phone-number login
                - listitem [ref=e161]: Enterprise SSO
              - paragraph [ref=e162]: When contacting us about a login problem, tell us which sign-in method you are using and describe the error you see.
            - generic [ref=e163]:
              - paragraph [ref=e164]: "03"
              - heading "Puku AI and Chat" [level=2] [ref=e165]
              - paragraph [ref=e166]: "Contact support if you experience a problem with Puku AI, including:"
              - list [ref=e167]:
                - listitem [ref=e168]: An AI response not appearing
                - listitem [ref=e169]: An unexpected AI error
                - listitem [ref=e170]: Search problems
                - listitem [ref=e171]: Agent activity problems
                - listitem [ref=e172]: Tool-call problems
                - listitem [ref=e173]: A photo not being processed correctly
                - listitem [ref=e174]: Voice-input problems
                - listitem [ref=e175]: A conversation or project not working as expected
              - paragraph [ref=e176]: Conversation history is stored locally for the relevant project.
              - paragraph [ref=e177]: If you delete the project, its locally stored conversation history is also deleted.
            - generic [ref=e178]:
              - paragraph [ref=e179]: "04"
              - heading "Photos and Images" [level=2] [ref=e180]
              - paragraph [ref=e181]: Puku can allow you to select a photo and use it as part of an AI conversation.
              - paragraph [ref=e182]: Photo permission is used so that you can choose the image you want to provide to Puku.
              - paragraph [ref=e183]: Puku does not retain the uploaded image as stored Puku user content.
              - paragraph [ref=e184]: The information necessary to process the image is passed through the applicable AI-processing route for the requested interaction.
            - generic [ref=e185]:
              - paragraph [ref=e186]: "05"
              - heading "Voice Input" [level=2] [ref=e187]
              - paragraph [ref=e188]: Puku uses microphone access when you choose to use a supported voice-input feature.
              - paragraph [ref=e189]: Puku sends the voice/audio required for the interaction through the applicable AI-processing route.
              - paragraph [ref=e190]: Puku does not retain the voice or audio recording as stored Puku user content.
            - generic [ref=e191]:
              - paragraph [ref=e192]: "06"
              - heading "App Permissions" [level=2] [ref=e193]
              - paragraph [ref=e194]: Puku currently requires permissions only where they are needed for supported features.
              - heading "Photos" [level=3] [ref=e195]
              - paragraph [ref=e196]: Used when you choose to upload or provide an image for an AI interaction.
              - heading "Microphone" [level=3] [ref=e197]
              - paragraph [ref=e198]: Used when you choose to provide voice input.
              - paragraph [ref=e199]: "Puku does not currently require:"
              - list [ref=e200]:
                - listitem [ref=e201]: Notifications permission
                - listitem [ref=e202]: Files or storage permission
                - listitem [ref=e203]: Location permission
                - listitem [ref=e204]: Contacts permission
              - paragraph [ref=e205]: If a supported feature is not working, check that you have granted the relevant permission in your phone's settings.
            - generic [ref=e206]:
              - paragraph [ref=e207]: "07"
              - heading "Subscription and Billing" [level=2] [ref=e208]
              - paragraph [ref=e209]:
                - text: Puku currently accepts payments through
                - strong [ref=e210]: bKash
                - text: .
              - paragraph [ref=e211]:
                - text: Puku uses
                - strong [ref=e212]: SSL eCommerce
                - text: as the payment gateway.
              - paragraph [ref=e213]: "If you need help with:"
              - list [ref=e214]:
                - listitem [ref=e215]: Subscription status
                - listitem [ref=e216]: A payment
                - listitem [ref=e217]: A billing problem
                - listitem [ref=e218]: Subscription cancellation
                - listitem [ref=e219]: A refund request
              - paragraph [ref=e220]: "contact:"
              - paragraph [ref=e221]:
                - link "support@puku.sh" [ref=e222] [cursor=pointer]:
                  - /url: mailto:support@puku.sh
            - generic [ref=e223]:
              - paragraph [ref=e224]: "08"
              - heading "Cancelling Your Subscription" [level=2] [ref=e225]
              - paragraph [ref=e226]: "To cancel your Puku subscription, contact:"
              - paragraph [ref=e227]:
                - link "support@puku.sh" [ref=e228] [cursor=pointer]:
                  - /url: mailto:support@puku.sh
              - paragraph [ref=e229]: To avoid being charged for the next billing period, submit your cancellation request at least 24 hours before your subscription is scheduled to renew.
              - paragraph [ref=e230]: Cancellation takes effect at the end of your current billing period.
              - paragraph [ref=e231]: You will continue to have access to the applicable paid features until the end of that billing period.
            - generic [ref=e232]:
              - paragraph [ref=e233]: "09"
              - heading "Refunds" [level=2] [ref=e234]
              - paragraph [ref=e235]: Except where required by applicable law, Puku fees are non-refundable.
              - paragraph [ref=e236]: "Puku generally does not provide refunds or credits for:"
              - list [ref=e237]:
                - listitem [ref=e238]: Partial subscription periods
                - listitem [ref=e239]: Unused features
                - listitem [ref=e240]: Account inactivity
              - paragraph [ref=e241]: If Puku terminates your subscription for a reason other than a breach of the Terms of Service by you, Puku will provide a pro-rata refund for the remaining unused portion of the applicable subscription term.
              - paragraph [ref=e242]: Nothing in this policy limits non-waivable consumer rights that apply under the law of your country.
              - paragraph [ref=e243]: "For help with a specific payment or refund request, contact:"
              - paragraph [ref=e244]:
                - link "support@puku.sh" [ref=e245] [cursor=pointer]:
                  - /url: mailto:support@puku.sh
            - generic [ref=e246]:
              - paragraph [ref=e247]: "10"
              - heading "Technical Problems" [level=2] [ref=e248]
              - paragraph [ref=e249]: When reporting a technical problem, please include information that can help us investigate it.
              - paragraph [ref=e250]: "Where relevant, include:"
              - list [ref=e251]:
                - listitem [ref=e252]: Your device model
                - listitem [ref=e253]: Operating-system version
                - listitem [ref=e254]: Puku app version
                - listitem [ref=e255]: A clear description of the problem
                - listitem [ref=e256]: What you were doing when the problem occurred
                - listitem [ref=e257]: Steps to reproduce the problem, if known
                - listitem [ref=e258]: A screenshot, where appropriate
              - paragraph [ref=e259]:
                - text: Puku uses internal crash and error monitoring, including
                - strong [ref=e260]: Sentry
                - text: ", to help identify and debug technical problems."
            - generic [ref=e261]:
              - paragraph [ref=e262]: "11"
              - heading "Protect Sensitive Information" [level=2] [ref=e263]
              - paragraph [ref=e264]: "Please do not send any of the following to Puku Support:"
              - list [ref=e265]:
                - listitem [ref=e266]: Passwords
                - listitem [ref=e267]: Authentication codes
                - listitem [ref=e268]: One-time passwords
                - listitem [ref=e269]: Verification codes
                - listitem [ref=e270]: API keys
                - listitem [ref=e271]: Access tokens
                - listitem [ref=e272]: Recovery codes
                - listitem [ref=e273]: Payment credentials
                - listitem [ref=e274]: Other sensitive credentials
              - paragraph [ref=e275]: If you send a screenshot, remove or hide private information that is not necessary for us to investigate the issue.
            - generic [ref=e276]:
              - paragraph [ref=e277]: "12"
              - heading "Privacy Requests" [level=2] [ref=e278]
